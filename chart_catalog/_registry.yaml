# Chart catalog registry — fed to the Tier-1/2 intent classifier.
# One entry per template in chart_catalog/. Currently a stub: only the generic
# time-series template used by the deterministic renderer.

time_series:
  description: "Generic time series line chart"
  use_when:
    - "User asks how a single metric evolves over time"
    - "NAV / return / exposure trajectory for one entity"
  required_data_columns: [date, value]
  tier: 2
  styling:
    palette: finance_red_green
    locale: zh-CN
