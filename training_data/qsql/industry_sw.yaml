# Core-ring Q-SQL pairs — Shenwan (申万) level-1 industries.
#
# ANTI-POISONING: every SQL below was executed against the live DB and its
# result inspected before commit (中欧医疗 ~93% in 医药生物; 蓝筹 latest top
# industry 食品饮料 led by 贵州茅台; 蓝筹 time series back to 2022-06).
#
# NOTE: the Vanna retriever is not wired yet. This seeds the Core ring so
# retrieval has gold to imitate; until then the agent generalizes via the view
# COMMENTs.
#
# Scope / surface routing:
#   v_fund_industry_alloc = INDUSTRY-level weights, all report dates + is_latest.
#       latest ranking / latest allocation → WHERE is_latest
#       time series (趋势/历史/近N年/堆叠图) → no is_latest filter
#   v_fund_holding_latest = INDIVIDUAL STOCKS in the latest snapshot (stock-level drill-down).
#   industry name uses LIKE to tolerate abbreviations (医药 -> 医药生物).

- id: sw_fund_top_in_industry
  question: 重仓医药生物行业最多的基金是哪只
  sql: |
    SELECT fund_name, ROUND(industry_weight::numeric, 4) AS industry_weight
    FROM v_fund_industry_alloc
    WHERE industry_l1 LIKE '%医药生物%' AND is_latest
    ORDER BY industry_weight DESC
    LIMIT 10;
  note: 最新一期各基金该行业权重排名；is_latest 取每只基金最新报告期，免相关子查询。

- id: sw_fund_industry_allocation
  question: 易方达蓝筹精选最新一期的行业配置分布
  sql: |
    SELECT industry_l1, ROUND(industry_weight::numeric, 4) AS industry_weight
    FROM v_fund_industry_alloc
    WHERE fund_name LIKE '%易方达蓝筹精选%' AND is_latest
    ORDER BY industry_weight DESC;
  note: 单基金最新截面的行业占比；未归类标的（港股/北交所）已排除。

- id: sw_fund_industry_timeseries
  question: 易方达蓝筹精选近三年各申万行业绝对仓位的变化（堆叠图）
  sql: |
    SELECT report_date, industry_l1, ROUND(industry_weight::numeric, 4) AS industry_weight
    FROM v_fund_industry_alloc
    WHERE fund_name LIKE '%易方达蓝筹精选%' AND report_date >= '2023-06-01'
    ORDER BY report_date, industry_l1;
  note: 时间序列→不加 is_latest；长表 (report_date, industry_l1, weight) 喂堆叠面积图。

- id: sw_fund_holdings_in_industry
  question: 易方达蓝筹精选最新全持仓里属于食品饮料行业的股票
  sql: |
    SELECT sec_name, sec_code, ROUND(weight::numeric, 4) AS weight
    FROM v_fund_holding_latest
    WHERE fund_name LIKE '%易方达蓝筹精选%' AND industry_l1 LIKE '%食品饮料%'
    ORDER BY weight DESC;
  note: 个股下钻用个股视图 v_fund_holding_latest（勿在此视图臆造 industry_weight）。

- id: sw_l2_fund_top
  question: 白酒板块仓位最高的基金是哪只
  sql: |
    SELECT fund_name, ROUND(industry_weight::numeric, 4) AS industry_weight
    FROM v_fund_industry_l2_alloc
    WHERE industry_l2 LIKE '%白酒%' AND is_latest
    ORDER BY industry_weight DESC
    LIMIT 10;
  note: 申万二级配置/排名/时序 → v_fund_industry_l2_alloc（一级用 v_fund_industry_alloc）；LIKE 容忍"白酒Ⅱ"后缀。

# --- Unified entry point v_fund_industry_any: preferred when a question names a specific
# industry regardless of level, which removes the "is it L1 or L2" routing step (the root
# cause of 0-row results for L2 names such as 半导体 / 白酒 on industry_l1). Verified:
# top 半导体 holder = 申万菱信智能驱动 (50.7%); 白酒 joins to the current manager via bridge_fund_manager.

- id: sw_any_named_industry
  question: 重仓半导体行业最多的前三只基金
  sql: |
    SELECT fund_name, ROUND(industry_weight::numeric, 4) AS industry_weight
    FROM v_fund_industry_any
    WHERE industry_name LIKE '%半导体%' AND is_latest
    ORDER BY industry_weight DESC
    LIMIT 3;
  note: 点名行业(一级或二级)→ v_fund_industry_any，industry_name LIKE 关键词，无需判断层级；半导体是二级，在此能查到、在 industry_l1 查不到。

- id: sw_any_industry_manager
  question: 白酒板块仓位最高的基金，它的基金经理是谁
  sql: |
    SELECT v.fund_name, m.manager_name, ROUND(v.industry_weight::numeric, 4) AS industry_weight
    FROM v_fund_industry_any v
    JOIN bridge_fund_manager bfm ON v.fund_code = bfm.fund_code AND bfm.is_current
    JOIN dim_manager m ON bfm.manager_id = m.manager_id
    WHERE v.industry_name LIKE '%白酒%' AND v.is_latest
    ORDER BY v.industry_weight DESC
    LIMIT 1;
  note: 行业(统一入口)×经理跨表；白酒是二级，v_fund_industry_any 命中后再 join bridge_fund_manager + dim_manager 取现任经理。
