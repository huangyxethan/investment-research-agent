# Core-ring Q-SQL pairs — 申万一级行业 (blueprint §6.2).
#
# ANTI-POISONING: every SQL below was executed against the live DB and its
# result inspected before commit (中欧医疗 ~93% in 医药生物; 蓝筹 top industry
# 食品饮料; 蓝筹 食品饮料 holdings led by 贵州茅台). These are the verified
# exemplars the §15 industry eval cases (sw_*) are derived from.
#
# NOTE: the Vanna retriever is not wired yet (W5). This file seeds the Core ring
# so retrieval has gold to imitate the moment it comes online. Until then, the
# agent generalizes on these intents via the COMMENTs on v_fund_holding_latest.
#
# 口径: questions about a fund's CURRENT/latest portfolio, industry allocation,
# or sector over/under-weight go through v_fund_holding_latest — it has already
# picked each fund's latest full-holding snapshot (no cross-period SUM) and
# pre-joined sec_name + 申万 industry. industry name uses LIKE for 简称 tolerance.

- id: sw_fund_top_in_industry
  question: 重仓医药生物行业最多的基金是哪只
  sql: |
    SELECT f.fund_name, ROUND(SUM(v.weight)::numeric, 4) AS industry_weight
    FROM v_fund_holding_latest v
    JOIN dim_fund f ON v.fund_code = f.fund_code
    WHERE v.industry_l1 LIKE '%医药生物%'
    GROUP BY f.fund_name
    ORDER BY industry_weight DESC
    LIMIT 10;
  note: 按目标行业在最新全持仓中的权重之和降序；视图已防跨期重复计算。

- id: sw_fund_industry_allocation
  question: 易方达蓝筹精选最新一期的行业配置分布
  sql: |
    SELECT v.industry_l1, ROUND(SUM(v.weight)::numeric, 4) AS industry_weight
    FROM v_fund_holding_latest v
    JOIN dim_fund f ON v.fund_code = f.fund_code
    WHERE f.fund_name LIKE '%易方达蓝筹精选%'
    GROUP BY v.industry_l1
    ORDER BY industry_weight DESC;
  note: industry_l1 为 NULL 的一档是未归类标的（港股通/北交所），保留以反映真实敞口。

- id: sw_fund_holdings_in_industry
  question: 易方达蓝筹精选最新全持仓里属于食品饮料行业的股票
  sql: |
    SELECT v.sec_name, v.sec_code, ROUND(v.weight::numeric, 4) AS weight
    FROM v_fund_holding_latest v
    JOIN dim_fund f ON v.fund_code = f.fund_code
    WHERE f.fund_name LIKE '%易方达蓝筹精选%' AND v.industry_l1 LIKE '%食品饮料%'
    ORDER BY weight DESC;
  note: 个基 × 行业的个股下钻；与配置分布同源（同一视图）。
