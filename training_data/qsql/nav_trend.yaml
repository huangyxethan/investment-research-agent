# Core-ring Q-SQL — multi-fund NAV comparison (year to date).
#
# LESSON (operator precedence): when several fund names are combined with OR they MUST
# be parenthesised before the shared AND conditions (dates etc.). Otherwise AND binds
# tighter than OR, the date filter applies only to the last name, and the other funds
# return their full history (observed: 285 YTD rows ballooned to 7,876 rows back to 2001).
# Verified: 3 funds, 285 YTD rows, 2026-01-05 → 2026-05-29.

- id: nav_compare_multi
  question: 对比易方达蓝筹精选、华夏成长和兴全合润今年以来的单位净值走势
  sql: |
    SELECT d.fund_name, n.nav_date, n.unit_nav
    FROM dim_fund d JOIN fact_nav n ON d.fund_code = n.fund_code
    WHERE (d.fund_name LIKE '%易方达蓝筹精选%'
        OR d.fund_name LIKE '%华夏成长%'
        OR d.fund_name LIKE '%兴全合润%')
      AND n.nav_date >= '2026-01-01'
    ORDER BY d.fund_name, n.nav_date;
  note: 多名称 OR 必须用括号包住再 AND 日期；否则日期只过滤最后一个基金。
